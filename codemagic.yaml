workflows:
  ios-release:
    name: Know Thyself — iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: integration     # name of the App Store Connect API key added in Codemagic UI

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        APP_STORE_APPLE_ID: 6786403340
        BUNDLE_ID: "com.anuragrishi.knowthyself"

    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*'
          include: true

    scripts:
      - name: Set up code signing (fresh cert + profile)
        script: |
          set -e
          keychain initialize

          echo "── Existing distribution certificates ──"
          app-store-connect certificates list --type IOS_DISTRIBUTION --json || true

          echo "── Creating a brand-new distribution certificate (with private key) ──"
          # Generate a private key locally, then create the cert from it so we
          # KEEP the private key (Apple never lets you re-download it).
          app-store-connect certificates create \
            --type IOS_DISTRIBUTION \
            --save

          echo "── Importing certificate(s) into keychain ──"
          keychain add-certificates

          echo "── Creating / fetching the App Store provisioning profile ──"
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create

          keychain add-certificates

          echo "── Signing identities now in keychain ──"
          security find-identity -v -p codesigning || true

          xcode-project use-profiles

      - name: Get Flutter packages
        script: |
          cd mobile_app
          flutter pub get

      - name: Install CocoaPods
        script: |
          cd mobile_app/ios
          pod install

      - name: Flutter build ipa
        script: |
          cd mobile_app
          flutter build ipa --release \
            --build-name=1.0.0 \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=$HOME/export_options.plist

    artifacts:
      - mobile_app/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false        # set true when ready for full public release
