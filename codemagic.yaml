workflows:
  ios-release:
    name: Know Thyself — iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.anuragrishi.knowthyself
      vars:
        APP_STORE_APPLE_ID: 6786403340
      app_store_connect:
        auth: integration              # uses the App Store Connect API key you add in Codemagic UI

    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*'
          include: true

    scripts:
      - name: Set up Flutter
        script: flutter pub get

      - name: Install pods
        script: |
          cd mobile_app/ios
          pod install

      - name: Build iOS release
        script: |
          cd mobile_app
          flutter build ipa \
            --release \
            --export-options-plist=/Users/builder/export_options.plist

      - name: Generate export options
        script: |
          cat > /Users/builder/export_options.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>$(APPLE_TEAM_ID)</string>
            <key>uploadBitcode</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
            <key>compileBitcode</key>
            <false/>
          </dict>
          </plist>
          EOF

    artifacts:
      - mobile_app/build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false   # set to true when ready for full release
