workflows:
  ios-release:
    name: Know Thyself — iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: integration     # name of the App Store Connect API key added in Codemagic UI

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        APP_STORE_APPLE_ID: 6786403340
        BUNDLE_ID: "com.anuragrishi.knowthyself"

    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*'
          include: true

    scripts:
      - name: Set up code signing (fresh cert + profile)
        script: |
          set -e
          keychain initialize

          echo "── Revoking any existing distribution certificates (clear orphans / stay under Apple's cert limit) ──"
          for cert_id in $(app-store-connect certificates list --type IOS_DISTRIBUTION --json 2>/dev/null | python3 -c "import sys, json; data=json.load(sys.stdin); print('\n'.join(c.get('id','') for c in data))" 2>/dev/null); do
            [ -z "$cert_id" ] && continue
            echo "Revoking old distribution certificate $cert_id"
            app-store-connect certificates delete "$cert_id" --certificate-key=@file:/tmp/dist_key.pem 2>/dev/null || \
              app-store-connect certificates delete "$cert_id" 2>/dev/null || true
          done

          echo "── Generating a fresh RSA private key ──"
          openssl genrsa -out /tmp/dist_key.pem 2048

          echo "── Creating a new distribution certificate from that key ──"
          app-store-connect certificates create \
            --type IOS_DISTRIBUTION \
            --certificate-key=@file:/tmp/dist_key.pem \
            --save

          keychain add-certificates

          echo "── Creating / fetching the App Store provisioning profile ──"
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@file:/tmp/dist_key.pem \
            --create

          keychain add-certificates

          echo "── Signing identities now in keychain ──"
          security find-identity -v -p codesigning || true

          xcode-project use-profiles

      - name: Get Flutter packages
        script: |
          cd mobile_app
          flutter pub get

      - name: Install CocoaPods
        script: |
          cd mobile_app/ios
          pod install

      - name: Flutter build ipa
        script: |
          cd mobile_app
          flutter build ipa --release \
            --build-name=1.0.0 \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=$HOME/export_options.plist

    artifacts:
      - mobile_app/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false        # set true when ready for full public release
