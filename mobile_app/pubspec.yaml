name: meditation_app
description: Meditation and spiritual audio streaming application
publish_to: "none"
# 2.0.0 was the LMS release: courses, payments, live sessions,
# certificates, push notifications and a full redesign.
#
# 2.1.0 is the botanical redesign, the in-app guide with voice input,
# scheduled pop-ups and paid live sessions. A minor bump rather than
# 3.0.0 — the app is recognisably the same one, which 2.0.0 could not
# claim.
#
# The build number after the + is what Play actually enforces, and it
# must increase on every upload, including uploads that never leave
# internal testing. +11 was never successfully built (see the pubspec
# restore in the bug chronology), so nothing was uploaded under it —
# but a skipped number costs nothing and a reused one is rejected.
#
# +13 is +12 rebuilt against an iOS deployment target of 15.0. App Store
# Connect refused +12 outright at 13.0 — the build number has to move
# even though not a line of Dart changed, because Apple has already seen
# that number.
#
# 2.1.1+14 pulls +13 out of review at both stores rather than waiting it
# out. +13 shipped a home screen that deleted every free user's
# downloads the moment they navigated back to it — data loss on the
# majority of accounts, which is worth forfeiting the review time
# already spent rather than letting it reach anyone else.
#
# 2.1.2 is the purple-glass restyle. No behaviour changed with it: no
# screen was added or removed, nothing became reachable that was not
# reachable in 2.1.1, and the iOS gating in core/config/purchase_config
# is untouched. That matters because 2.1.1 is the build Apple approved
# as a reader app under Guideline 3.1.3(a), and this submission has to
# be able to say truthfully that only the paint changed.
#
# +16 follows +15, which itself only existed because Play refused +14 as
# already used. Note this number only reaches a store from a local
# build: codemagic.yaml passes --build-number=$BUILD_NUMBER and ignores
# what is written here, so CI builds carry their own, higher numbers.
# That means a local Android upload has to clear the highest versionCode
# CI has ever pushed, not merely the last one written down here — check
# Play Console -> App bundle explorer before trusting +16.
version: 2.1.2+17

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  supabase_flutter: ^2.5.6
  device_info_plus: ^10.1.0
  flutter_secure_storage: ^9.2.2
  crypto: ^3.0.3
  just_audio: ^0.9.40
  audio_service: ^0.18.15
  rxdart: ^0.27.7
  path_provider: ^2.1.4
  http: ^1.2.2
  pointycastle: ^3.9.1
  google_sign_in: ^6.2.1
  # Required by App Store Guideline 4.8: an app offering a third-party
  # login must offer Sign in with Apple alongside it. Shown on iOS only —
  # on Android it is an extra button with nothing behind it.
  sign_in_with_apple: ^6.1.4
  url_launcher: ^6.3.0
  video_player: ^2.9.1
  chewie: ^1.8.5
  open_filex: ^4.5.0
  share_plus: ^10.0.2
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  # FCM shows a notification by itself only when the app is in the
  # background. A reminder that lands while someone has the app open is
  # the one most worth showing, so foreground messages are re-posted
  # through the local plugin.
  flutter_local_notifications: ^17.2.3
  # Voice input for the guide. Uses the platform's own recogniser —
  # Android's SpeechRecognizer, iOS's SFSpeechRecognizer — so dictation
  # costs nothing per minute, works in the languages the handset already
  # has, and no audio leaves the device.
  speech_to_text: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/app_icon.png"
  adaptive_icon_background: "#12082E"
  adaptive_icon_foreground: "assets/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/

  # Bundled, not fetched at runtime via google_fonts. This app is used
  # offline — downloaded meditations play with no network — and a first
  # launch on a plane that falls back to a system serif would undo the
  # typography the whole design rests on.
  fonts:
    # Display: greetings, screen and cover titles, the certificate.
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-Medium.ttf
          weight: 500
        - asset: assets/fonts/Fraunces-SemiBold.ttf
          weight: 600
    # Text: everything else. Covers Latin AND Devanagari, so Hinglish
    # sits in one family instead of switching font mid-sentence.
    - family: Mukta
      fonts:
        - asset: assets/fonts/Mukta-Regular.ttf
          weight: 400
        - asset: assets/fonts/Mukta-Medium.ttf
          weight: 500
        - asset: assets/fonts/Mukta-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Mukta-Bold.ttf
          weight: 700
