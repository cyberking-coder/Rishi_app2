name: meditation_app
description: Meditation and spiritual audio streaming application
publish_to: "none"
# 2.0.0 was the LMS release: courses, payments, live sessions,
# certificates, push notifications and a full redesign.
#
# 2.1.0 is the botanical redesign, the in-app guide with voice input,
# scheduled pop-ups and paid live sessions. A minor bump rather than
# 3.0.0 — the app is recognisably the same one, which 2.0.0 could not
# claim.
#
# The build number after the + is what Play actually enforces, and it
# must increase on every upload, including uploads that never leave
# internal testing. +11 was never successfully built (see the pubspec
# restore in the bug chronology), so nothing was uploaded under it —
# but a skipped number costs nothing and a reused one is rejected.
#
# +13 is +12 rebuilt against an iOS deployment target of 15.0. App Store
# Connect refused +12 outright at 13.0 — the build number has to move
# even though not a line of Dart changed, because Apple has already seen
# that number.
#
# 2.1.1+14 pulls +13 out of review at both stores rather than waiting it
# out. +13 shipped a home screen that deleted every free user's
# downloads the moment they navigated back to it — data loss on the
# majority of accounts, which is worth forfeiting the review time
# already spent rather than letting it reach anyone else.
#
# 2.1.2 is the purple-glass restyle. No behaviour changed with it: no
# screen was added or removed, nothing became reachable that was not
# reachable in 2.1.1, and the iOS gating in core/config/purchase_config
# is untouched. That matters because 2.1.1 is the build Apple approved
# as a reader app under Guideline 3.1.3(a), and this submission has to
# be able to say truthfully that only the paint changed.
#
# +16 follows +15, which itself only existed because Play refused +14 as
# already used. Note this number only reaches a store from a local
# build: codemagic.yaml passes --build-number=$BUILD_NUMBER and ignores
# what is written here, so CI builds carry their own, higher numbers.
# That means a local Android upload has to clear the highest versionCode
# CI has ever pushed, not merely the last one written down here — check
# Play Console -> App bundle explorer before trusting the number below.
#
# 2.2.0 is a minor bump, not another patch, because this one adds things
# rather than repainting them: Help & Support (a screen, four tables and
# a ticket conversation), a resume card that reopens the lesson you were
# in, and artwork plus skip controls on the offline player. 2.1.2 could
# honestly tell App Review that only the paint had changed; this cannot,
# and claiming otherwise under Guideline 2.3 is not worth the version
# digit it would save.
#
# It also carries the fix for the purge that deleted a staff account's
# downloads on every launch — hasLapsed was true at the same time as
# hasAccess, and the destructive answer won.
#
# One line sets both platforms: Android reads versionCode/versionName
# from it via local.properties, and Info.plist passes it through as
# $(FLUTTER_BUILD_NUMBER)/$(FLUTTER_BUILD_NAME). Keep AppConfig.appVersion
# in step — support tickets report it.
#
# +19 replaces +18, which was never uploaded anywhere. +18 shipped a
# settings sheet whose "Delete my account" row sat past the bottom edge
# of a sheet that could not scroll — unreachable, and the row the App
# Store review notes name as reachable in two taps. Nothing else changed.
#
# +20 withholds the guide on iOS (kGuideEnabled), in support of a second
# External Link Account Entitlement request — see Section 14. Android is
# unchanged and keeps the guide in full. Note that codemagic.yaml passes
# --build-number=$BUILD_NUMBER, so a CI build carries its own number and
# this one governs local builds only.
#
# 2.2.1+21 is a bug-fix release: the Razorpay webhook now ignores
# account-wide payments that aren't from the app (a foreign Payment Page
# payment was 400ing and got the live webhook auto-disabled); audio streams
# are served with a real audio Content-Type so iOS stops rejecting them with
# -11828; offline downloads play on iOS again (NSAllowsLocalNetworking lets
# AVPlayer reach the loopback decrypting proxy, which ATS was blocking with
# -1004); and a track no longer re-buffers on load ("opens twice"). A patch
# bump, not a minor: nothing was added, these are fixes to shipped behaviour.
# Keep AppConfig.appVersion in step — support tickets report it.
#
# 2.2.2+22 adds the iOS External Link Account link (entitlement granted
# 3 Sep 2026): a single neutral "Manage your account" link on iOS, behind
# kExternalAccountLinkEnabled, that opens pay.anuragrishi.com/store — the only
# in-app route by which an iPhone member can reach a checkout. It also carries
# the fix for offline downloads vanishing after a restart: the launch purge
# was user-scoped and deleted files a routine device reset had marked revoked,
# even on an account that still had access; the purge is now device-aware and
# never deletes a copy the active device still holds (paired with migration
# 20260908000001, which un-revokes a device's downloads when it re-registers).
# +24 fixes the real "downloads vanish" cause: when an access window lapsed,
# the home screen purged ALL downloads, including FREE ones — but free content
# never needed access, so a free track a user downloaded should survive expiry.
# The lapse purge now removes only premium downloads (looked up server-side)
# and keeps free ones; logout still clears everything. Also drops the +23
# on-device diagnostic once the cause was found in the logs.
#
# +25 removes the leftover on-device download diagnostic entirely, and routes
# every in-app "open the player" through openNowPlaying() — one helper that
# won't push /now-playing if it is already the current route or while a push
# is still in flight, so Home, Browse, the mini player and the lesson launcher
# can no longer stack two identical Now Playing screens.
#
# +35 fixes the App Store 3.1.1 rejection of 2.2.2(38): the External Link
# Account link must use StoreKit's ExternalLinkAccount.open() API, which
# presents Apple's OWN disclosure sheet before opening the URL from Info.plist's
# SKExternalLinkAccount. The previous build drew its own dialog + url_launcher,
# which the entitlement does not accept. Added a native MethodChannel
# (ios/Runner/AppDelegate.swift) calling ExternalLinkAccount.open(); the Dart
# side (Profile -> Manage your account) invokes it and no longer shows a custom
# dialog or launches the URL itself.
#
# 2.3.1+26/+27 briefly carried a version-NAME bump to 2.3.1, then the download
# retry/resume work. The name is reverted to 2.2.2 at +28 because the App Store
# Connect version entry is 2.2.2 (its earlier build was developer-rejected), and
# a new build must match that entry's version string; only the build number has
# to climb, which it does (+28 > +27). No behaviour changed with the revert.
#
# +27 makes downloads survive a dropped mobile connection. A transfer that
# fails mid-stream ("Connection closed while receiving data") now retries up to
# four times, each attempt fetching a fresh signed URL and resuming from the
# bytes already on disk via a Range request — so a long file over a flaky
# connection completes instead of failing on the first blip, and an expired
# signed URL is simply re-minted. Silent truncation (a short read with no
# error) is caught and retried too. And no raw exception (which carried the
# whole signed URL) is ever shown: download and playback failures now display
# a short, friendly message.
# +29 strengthens the iOS ATS exception for the offline-playback loopback.
# NSAllowsLocalNetworking alone was not enough for AVPlayer to reach the raw
# 127.0.0.1 proxy on device (still -1004), so 127.0.0.1 and localhost now carry
# an explicit NSExceptionAllowsInsecureHTTPLoads exception. ATS stays enforced
# everywhere else (NSAllowsArbitraryLoads is still false). iOS build number is
# assigned by Codemagic; this +29 governs local/Android builds.
#
# +30 makes cover art show WHOLE everywhere. RemoteImage defaulted to
# BoxFit.cover, which cropped the same upload differently in each box (a
# portrait cover showed only its middle in the 40px mini-player and the 52px
# continue tile, and course art cropped in its hero). The default is now
# BoxFit.contain: a square image still fills a square box with no gap, and any
# other shape is shown in full, letterboxed against the surface behind. One
# upload now looks right in every section.
# +31 moves the "One account. One device." note above the login form (it was
# below the sign-up link, off the bottom of the screen) so it is visible while
# signing in rather than only after a scroll.
#
# +32 reverts the +30 cover change (BoxFit.contain) back to BoxFit.cover:
# contain left visible empty (white) space around non-square covers, which read
# worse than a centred crop. Filling with no gap requires cover; the real fix
# for cropping is the upload SHAPE — square (1:1) audio art and 16:9 course art
# fill every box with no crop and no gap.
#
# +33 briefly made the audio cover boxes 16:9; +34 sets them to SQUARE (1:1)
# instead, per the decision that audio art is 1:1 and only courses are 16:9. The
# featured card is now a true square (168x168, row height nudged to 216) and the
# browse tile, continue tile and mini-player art are back to square. A square
# audio cover fills them with no crop and no gaps; courses keep their 16:9 cards.
version: 2.2.2+36

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  supabase_flutter: ^2.5.6
  device_info_plus: ^10.1.0
  flutter_secure_storage: ^9.2.2
  crypto: ^3.0.3
  just_audio: ^0.9.40
  audio_service: ^0.18.15
  rxdart: ^0.27.7
  path_provider: ^2.1.4
  http: ^1.2.2
  pointycastle: ^3.9.1
  google_sign_in: ^6.2.1
  # Required by App Store Guideline 4.8: an app offering a third-party
  # login must offer Sign in with Apple alongside it. Shown on iOS only —
  # on Android it is an extra button with nothing behind it.
  sign_in_with_apple: ^6.1.4
  url_launcher: ^6.3.0
  video_player: ^2.9.1
  chewie: ^1.8.5
  open_filex: ^4.5.0
  share_plus: ^10.0.2
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  # FCM shows a notification by itself only when the app is in the
  # background. A reminder that lands while someone has the app open is
  # the one most worth showing, so foreground messages are re-posted
  # through the local plugin.
  flutter_local_notifications: ^17.2.3
  # Voice input for the guide. Uses the platform's own recogniser —
  # Android's SpeechRecognizer, iOS's SFSpeechRecognizer — so dictation
  # costs nothing per minute, works in the languages the handset already
  # has, and no audio leaves the device.
  speech_to_text: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/app_icon.png"
  adaptive_icon_background: "#12082E"
  adaptive_icon_foreground: "assets/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/

  # Bundled, not fetched at runtime via google_fonts. This app is used
  # offline — downloaded meditations play with no network — and a first
  # launch on a plane that falls back to a system serif would undo the
  # typography the whole design rests on.
  fonts:
    # Display: greetings, screen and cover titles, the certificate.
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-Medium.ttf
          weight: 500
        - asset: assets/fonts/Fraunces-SemiBold.ttf
          weight: 600
    # Text: everything else. Covers Latin AND Devanagari, so Hinglish
    # sits in one family instead of switching font mid-sentence.
    - family: Mukta
      fonts:
        - asset: assets/fonts/Mukta-Regular.ttf
          weight: 400
        - asset: assets/fonts/Mukta-Medium.ttf
          weight: 500
        - asset: assets/fonts/Mukta-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Mukta-Bold.ttf
          weight: 700
