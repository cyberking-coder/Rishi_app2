name: meditation_app
description: Meditation and spiritual audio streaming application
publish_to: "none"
version: 1.0.0+3

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  supabase_flutter: ^2.5.6
  device_info_plus: ^10.1.0
  flutter_secure_storage: ^9.2.2
  crypto: ^3.0.3
  just_audio: ^0.9.40
  audio_service: ^0.18.15
  rxdart: ^0.27.7
  path_provider: ^2.1.4
  http: ^1.2.2
  pointycastle: ^3.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/app_icon.png"
  adaptive_icon_background: "#12082E"
  adaptive_icon_foreground: "assets/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
