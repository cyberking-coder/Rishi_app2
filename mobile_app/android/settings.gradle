pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "8.9.1" apply false
    id "org.jetbrains.kotlin.android" version "2.2.20" apply false
    // Reads google-services.json and generates the Firebase config the
    // Messaging SDK reads at startup. Declared here, applied in app/ —
    // and applied only when the file is actually present, see there.
    id "com.google.gms.google-services" version "4.5.0" apply false
    // NOTE: the com.google.firebase.crashlytics GRADLE PLUGIN is deliberately
    // NOT declared here. It only adds build-time extras — automatic R8-mapping
    // upload and NDK (native C++) symbol upload — and its buildtools jar is a
    // large download that repeatedly failed with TLS corruption (bad_record_mac)
    // on some networks, blocking the build outright. The firebase_crashlytics
    // Flutter package still reports Java/Kotlin and Dart crashes at RUNTIME
    // without this plugin, which covers the launch crashes we are chasing. Re-add
    // it on a clean network / CI if native-symbol or mapping upload is wanted.
}

include ":app"
