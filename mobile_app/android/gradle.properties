org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# Kotlin's incremental compiler crashes when the project and the pub cache
# live on different Windows drives (e.g. project on D:, pub cache on C:),
# failing with "this and base files have different roots". Disabling
# incremental Kotlin compilation avoids that cross-drive path computation.
kotlin.incremental=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
