plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

// google-services.json carries the project's Firebase keys and is not in
// the repository, so the plugin is applied only when the file is there.
// Applying it unconditionally would fail the build outright for anyone
// who hasn't downloaded it yet — the same reasoning as the release
// signing block below, which falls back rather than breaking.
//
// The consequence of it being absent is that push is inert, not that the
// app breaks: FirebaseMessagingService checks for initialisation before
// asking for a token.
if (file("google-services.json").exists()) {
    apply plugin: "com.google.gms.google-services"
    // The com.google.firebase.crashlytics gradle plugin is intentionally NOT
    // applied — see the note in settings.gradle. Crash reporting still works
    // at runtime via the firebase_crashlytics package; only build-time mapping
    // / NDK symbol upload is skipped.
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode")
if (flutterVersionCode == null) {
    flutterVersionCode = "1"
}

def flutterVersionName = localProperties.getProperty("flutter.versionName")
if (flutterVersionName == null) {
    flutterVersionName = "1.0"
}

// Release signing — credentials live in android/key.properties, which is
// gitignored and never committed. If absent (e.g. CI without secrets), the
// release build falls back to debug signing so it still compiles.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withReader("UTF-8") { reader ->
        keystoreProperties.load(reader)
    }
}

android {
    namespace "com.knowthyself.app"
    compileSdk = 36
    ndkVersion = flutter.ndkVersion

    compileOptions {
        // flutter_local_notifications reaches for java.time on API levels
        // that predate it, and its AAR metadata makes desugaring a hard
        // requirement rather than a suggestion — the build fails outright
        // without it. See the coreLibraryDesugaring dependency below;
        // both halves are needed, and enabling only this one still fails.
        coreLibraryDesugaringEnabled true
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
    }

    defaultConfig {
        applicationId "com.knowthyself.app"
        minSdkVersion = flutter.minSdkVersion
        targetSdk = 36
        versionCode = flutterVersionCode.toInteger()
        // Play Store version name is pinned to 3.0.0 here, independent of the
        // Flutter/pubspec version (2.2.9) that iOS uses — the two stores carry
        // different marketing versions. versionCode still comes from the build
        // number (Codemagic's counter), so uploads keep incrementing.
        versionName = "3.0.0"
        multiDexEnabled true
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias keystoreProperties["keyAlias"]
                keyPassword keystoreProperties["keyPassword"]
                storeFile file(keystoreProperties["storeFile"])
                storePassword keystoreProperties["storePassword"]
            }
        }
    }

    buildTypes {
        release {
            // Use the real release keystore when key.properties is present,
            // otherwise fall back to debug signing so the build still works.
            signingConfig = keystorePropertiesFile.exists() ? signingConfigs.release : signingConfigs.debug
            // R8: obfuscate + shrink Kotlin/Java bytecode and strip unused
            // resources, so a pulled-apart APK is much harder to read.
            minifyEnabled true
            shrinkResources true
            proguardFiles(
                getDefaultProguardFile("proguard-android-optimize.txt"),
                "proguard-rules.pro"
            )
        }
        debug {
            // A separate ".debug" application id lets a debug build sit next
            // to a release install — but the Google Services Gradle plugin
            // then needs a Firebase client registered for
            // "com.knowthyself.app.debug", or it fails the build with
            // "No matching client found for package name ...". So only apply
            // the suffix when a debug-specific google-services.json is present
            // (i.e. that client exists, dropped at src/debug/). Otherwise fall
            // back to the base id, which the main google-services.json already
            // matches — this is what lets `flutter run`/integration tests build
            // in debug on a machine with only the release Firebase config.
            if (file("src/debug/google-services.json").exists()) {
                applicationIdSuffix ".debug"
                versionNameSuffix "-debug"
            }
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8"
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"
}
