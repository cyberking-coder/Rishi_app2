# Automated regression testing — Phase 1 pipeline.
#
# See docs/proposals/regression-testing-plan.md. Three fast, hermetic jobs
# run on every push and pull request and are the intended merge gate. The
# device-based integration job (Phase 9) is deliberately NOT here yet; it
# lands as a separate, initially non-blocking workflow once journeys exist.
name: Regression Tests

on:
  push:
    branches: ["**"]
  pull_request:

# A newer push to the same ref cancels the older in-flight run.
concurrency:
  group: regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile:
    name: Mobile — analyze + unit/widget tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  admin:
    name: Admin — lint + typecheck + unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test

  supabase:
    name: Supabase — edge function tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supabase/functions
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # Default: no runtime permissions. Real function tests that need
      # env/net will opt in per-file with their own flags.
      - run: deno test
